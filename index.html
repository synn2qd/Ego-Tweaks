<body class="booting">
  <!-- ───────────── boot sequence (same as the app) ───────────── -->
  <div id="boot" class="boot" role="status" aria-live="polite" aria-label="Loading Ego Tweaks">
    <div class="boot-visor top" aria-hidden="true"></div><div class="boot-visor bot" aria-hidden="true"></div>
    <div class="boot-grid" aria-hidden="true"></div>
    <div class="boot-sweep" aria-hidden="true"></div>
    <div class="boot-flash" aria-hidden="true"></div>
    <div class="boot-stage">
      <svg class="boot-rings" viewBox="-300 -300 600 600" aria-hidden="true">
        <circle class="ring ring-outer" r="286"></circle>
        <g class="ring-ticks" id="boot-ticks"></g>
        <circle class="ring ring-seg" r="226"></circle>
        <circle class="ring ring-thin" r="206"></circle>
        <g class="ring-sweep"><path d="M 0 -206 A 206 206 0 0 1 145.66 -145.66"></path></g>
        <g class="ring-cross">
          <line x1="-300" y1="0" x2="-246" y2="0"></line><line x1="246" y1="0" x2="300" y2="0"></line>
          <line x1="0" y1="-300" x2="0" y2="-246"></line><line x1="0" y1="246" x2="0" y2="300"></line>
        </g>
      </svg>
      <div class="boot-mark">
        <div class="boot-line" aria-hidden="true"></div>
        <h1 class="wordmark" aria-label="Ego"><span>E</span><span>G</span><span>O</span></h1>
        <div class="boot-sub" id="boot-sub" aria-label="Tweaks">TWEAKS</div>
      </div>
    </div>
    <div class="boot-log" id="boot-log" aria-hidden="true"></div>
    <div class="boot-foot">
      <div class="boot-step" id="boot-step">Starting</div>
      <div class="boot-bar"><i id="boot-bar"></i></div>
      <div class="boot-pct" id="boot-pct">0%</div>
    </div>
    <div class="boot-hud" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="bh-l">Ego Tweaks</span><span class="bh-r" id="boot-ver"></span></div>
    <div class="boot-skip" aria-hidden="true"><span class="k-key">Press any key to skip</span><span class="k-tap">Tap to skip</span></div>
  </div>

  <!-- ───────────── site ───────────── -->
  <div id="site" class="site" hidden>
    <button type="button" class="skip" data-act="skip">Skip to content</button>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>
    <div class="lock" id="lock" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      </div>

    <main id="view" tabindex="-1"></main>
    <footer class="foot" id="foot"></footer>
    <div class="dock" id="dock" hidden></div>

    </div>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- If the Supabase script was blocked (ad blocker, offline), auth.js gets an offline client: accounts say
       they're unavailable, and the boot, Discord login and downloads keep working. -->
  <script>if (!window.supabase) window.supabase = { offline: true, createClient() { const no = () => Promise.reject(new Error('Accounts are unavailable right now — try again in a minute.')); const q = () => ({ select: q, eq: q, maybeSingle: no, insert: no }); return { auth: { getSession: no, getUser: no, signUp: no, signInWithPassword: no, updateUser: no, signOut: () => Promise.resolve({ error: null }), onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }) }, from: q, rpc: no }; } };</script>
